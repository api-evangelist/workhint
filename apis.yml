aid: workhint
name: Workhint
description: Workhint is a work orchestration platform that uses AI to configure workflows,
  roles, and operations from modular components, helping teams manage flexible and
  on-demand workforces. The platform spans sourcing and onboarding, a workflow engine,
  tasks and projects, shifts and field visits, delivery management, auto-invoicing,
  global payments and payout workflows, contract management, and 1099 compliance.
  Backed by 500 Global and Softeq. API access and custom integrations are offered
  on the Enterprise plan, but no public developer portal or API documentation is
  published.
